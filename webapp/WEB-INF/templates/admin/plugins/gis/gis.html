<#list view_list as view>
	<div id="result_${view.id}">
	</div>
	<@button type='button' id='button_view${view.id}' title='charger carte ${view.id}' params='onclick="load_view(${view.id}, \'result_${view.id}\');"' />
	<br />
</#list>

<script>
	function load_view(viewId, targetElementId) {
		var script = document.createElement( 'script' );
		script.src = '${base_url}/js/plugins/gis/openlayers/OpenLayers.js';
		script.onload = function( ) {
			fetch( 'jsp/site/Portal.jsp?gis_id=' + viewId )
				.then( function( response ) { return response.text( ); } )
				.then( function( data ) { document.getElementById( targetElementId ).innerHTML = data; } );
		};
		document.head.appendChild( script );
		document.getElementById( 'button_view' + viewId ).remove( );
	};
</script>

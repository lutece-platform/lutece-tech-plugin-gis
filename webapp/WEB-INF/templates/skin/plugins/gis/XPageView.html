<#assign map_name="carte">
<#assign openLayersPath="js/plugins/gis/openlayers/">

<script src="${openLayersPath}OpenLayers.js"></script>
<script src="${openLayersPath}CustomLayerSwitcher.js"></script>
<script src="${openLayersPath}Legend.js"></script>
<script src="${openLayersPath}LayerSearchPanel.js"></script>
<script src="${openLayersPath}GeolocalizationPanel.js"></script>

<link rel="stylesheet" type="text/css" href="${openLayersPath}Legend.css" />
<link rel="stylesheet" type="text/css" href="${openLayersPath}LayerSearchPanel.css" />
<link rel="stylesheet" type="text/css" href="${openLayersPath}GeolocalizationPanel.css" />
<link rel="stylesheet" href="css/plugins/gis/gis.css" type="text/css" media="screen, projection, print" />

<@cTpl>
<@cContainer>
<div id="${map_name}" class="map" style="display: none">
	<#include "/${view_name}">
</div>
</@cContainer>
</@cTpl>

<script>
	document.getElementById( '${map_name}' ).style.display = '';
</script>
